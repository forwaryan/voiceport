name: macOS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Rust and packaging
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Node.js 22 for QQ offline tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy

      - name: Cache Cargo dependencies and builds
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-cargo-

      # Prepare locked dependencies even when the cache is empty or partial.
      - name: Fetch locked dependencies
        env:
          CARGO_NET_OFFLINE: 'false'
        run: cargo fetch --locked

      - name: Run QQ offline diagnostic tests
        run: |
          node --test Tests/QQBridgeTests/*.test.cjs
          python3 -I -m unittest discover -s Tests/QQBridgeTests -p 'test_*.py' -v

      - name: Run offline Rust and Python checks
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          bash scripts/test_rust.sh
          cargo build --workspace --release --locked
          python3 -I -m unittest discover -s Tests/LoopTests -v
          python3 -I -m unittest discover -s .claude/hooks -p 'test_*.py' -v
          # RealBundleTests packages release products into a fresh temporary bundle.
          python3 -I -m unittest discover -s Tests/PackagingTests -v
