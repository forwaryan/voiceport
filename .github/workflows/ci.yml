name: macOS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer PR commit supersedes its previous checks. Give every main run its
# own group: even cancel-in-progress:false can replace a shared pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Rust and packaging
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Include the PR merge parents while checkout still has its token.
          # Later unauthenticated fetches may be unavailable in private repos.
          fetch-depth: 2

      - name: Determine validation scope
        id: scope
        run: python3 -I scripts/ci_scope.py >> "$GITHUB_OUTPUT"

      - name: Test CI scope selection
        run: python3 -I -m unittest discover -s Tests/CITests -p test_ci_scope.py -v

      # Keep the required job present for every PR instead of using workflow
      # paths-ignore (which can leave a required check pending indefinitely).
      - name: Validate documentation diff
        if: steps.scope.outputs.full == 'false'
        env:
          CI_BASE: ${{ steps.scope.outputs.base }}
        run: |
          git diff --check "$CI_BASE" HEAD --
          printf '%s\n' 'Documentation-only PR: diff and CI scope tests passed. Rust and packaging checks run on code changes and every main push.' >> "$GITHUB_STEP_SUMMARY"

      - name: Install Node.js 22 for QQ offline tests
        if: steps.scope.outputs.full != 'false'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install Rust 1.95.0
        if: steps.scope.outputs.full != 'false'
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy

      # Cache dependency artifacts, not the entire growing target directory.
      # Keys include compiler, Cargo manifests/lockfiles and compiler settings;
      # the action prunes workspace outputs, stale crates and incremental data.
      - name: Cache Rust dependencies
        if: steps.scope.outputs.full != 'false'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos-15-rust-1.95.0
          cache-bin: 'false'

      # Prepare locked dependencies even when the cache is empty or partial.
      - name: Fetch locked dependencies
        if: steps.scope.outputs.full != 'false'
        env:
          CARGO_NET_OFFLINE: 'false'
        run: cargo fetch --locked

      # Packaging reads release products; build them before overlapping its two
      # isolated process shards with Rust and the remaining offline suites.
      - name: Build release products
        if: steps.scope.outputs.full != 'false'
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo build --workspace --release --locked

      - name: Run full offline checks in parallel
        id: checks
        if: steps.scope.outputs.full != 'false'
        env:
          CARGO_NET_OFFLINE: 'true'
        run: python3 -I scripts/ci_checks.py

      - name: Preserve per-check logs and timings
        if: always() && steps.scope.outputs.full != 'false' && steps.checks.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: .voiceport/evidence/ci-*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
