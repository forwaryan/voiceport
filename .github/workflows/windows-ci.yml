name: Windows CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Supersede older runs for the same PR and let every main run finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Native Rust (x64 MSVC)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.95.0-x86_64-pc-windows-msvc
      WINDOWS_TARGET: x86_64-pc-windows-msvc
      CARGO_TERM_COLOR: always
      CARGO_NET_OFFLINE: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Record the checkout commit, parents and tree
        run: git show --no-patch --format='checkout=%H%nparents=%P%ntree=%T' HEAD

      - name: Install pinned Rust toolchain
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal

      - name: Record the Rust toolchain
        run: rustc --version --verbose

      - name: Fetch locked dependencies
        env:
          CARGO_NET_OFFLINE: 'false'
        run: cargo fetch --locked --target $env:WINDOWS_TARGET

      - name: Build and link the default Windows executable
        run: cargo build --locked --offline --target $env:WINDOWS_TARGET -p voiceport-windows --bin voiceport-windows

      - name: Run executable help and no-I/O smoke test
        run: |
          $executable = "target/$env:WINDOWS_TARGET/debug/voiceport-windows.exe"
          & $executable --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $executable --smoke-test

      - name: Check the library and executable without the service feature
        run: cargo check --locked --offline --target $env:WINDOWS_TARGET -p voiceport-windows --no-default-features --lib --bin voiceport-windows

      - name: Run default-feature Windows tests offline
        # Keep the native device and NTFS integration tests marked ignored.
        run: cargo test --locked --offline --target $env:WINDOWS_TARGET -p voiceport-windows --no-fail-fast
