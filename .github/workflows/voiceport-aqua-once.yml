name: VoicePort isolated Aqua acceptance
run-name: VoicePort isolated Aqua acceptance (${{ github.sha }})

on:
  push:
    branches: [ci/voiceport-aqua-3815feb1d0e4]

permissions:
  contents: read

jobs:
  aqua:
    if: github.event.created && !github.event.deleted && github.run_attempt == '1'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      VP_AQUA_SOURCE_TREE: '3815feb1d0e49d95e0960f64bd6df11735d108b1'
      VP_AQUA_REF: 'refs/heads/ci/voiceport-aqua-3815feb1d0e4'
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify fixed source and run isolated synthetic cases
        shell: bash
        run: python3 -I -B scripts/hosted_aqua_acceptance.py
      - name: Keep only fixed-schema synthetic receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voiceport-aqua-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/voiceport-aqua-receipt/receipt.json
          retention-days: 3
          if-no-files-found: ignore
