name: Item 45 isolated Aqua
on:
  push:
    branches: [ci/item45-aqua-once-2a4a9cf]

permissions:
  contents: read

jobs:
  aqua:
    if: github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check the reserved guest and source
        shell: bash
        run: |
          set -euo pipefail
          [[ $(uname -m) == arm64 && $(sw_vers -productVersion) == 15.* ]]
          [[ $(/usr/sbin/sysctl -n kern.hv_vmm_present) == 1 ]]
          [[ $(git rev-parse HEAD^) == 2a4a9cf21ebfb92243bc28d410f800d7d85bd91d ]]
          [[ $(git rev-parse HEAD) == "$GITHUB_SHA" ]]
          [[ -z $(git status --porcelain) ]]
      - name: Fetch locked dependencies
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          cargo +1.95.0 fetch --locked
      - name: Run the dedicated fixture through LaunchServices
        shell: bash
        run: |
          set -euo pipefail
          boot=$(/usr/sbin/sysctl -n kern.bootsessionuuid)
          asid=$(/bin/launchctl print "gui/$(id -u)" | /usr/bin/awk '$1 == "asid" && $2 == "=" {print $3}')
          [[ $asid =~ ^[0-9]+$ ]]
          export RUSTUP_TOOLCHAIN=1.95.0
          python3 -I -B scripts/item45_acceptance/verify.py aqua --verify-hosted \
            --expected-tree "$(git rev-parse HEAD^{tree})" --authorized-isolated-vm "$boot" "$asid" \
            --out "$RUNNER_TEMP/item45-evidence" --target "$RUNNER_TEMP/item45-target"
      - name: Summarize allowlisted observations
        if: always()
        shell: bash
        run: |
          python3 -I -B -c '
          import json, pathlib, re, sys
          folder = pathlib.Path(sys.argv[1])
          path = folder / "report.json"
          if not path.is_file():
              print("No fixture report. Check guest preflight and build steps.")
              sys.exit(0)
          report = json.loads(path.read_text())
          print("tree", report["tree"], "status", report["status"])
          print("fixture_bundle_deleted", report.get("bundle_deleted"))
          for check in report["checks"]:
              print(check["name"], "exit", check["exit_code"], "cleanup", check["cleanup_confirmed"])
          aqua = report.get("aqua", {})
          for key in ("stage", "exit_code", "raw_wait_status", "opener_exit_code", "app_exit_observed", "cleanup_confirmed", "presentation_verified"):
              print(key, aqua.get(key))
          app = folder / "aqua.out"
          patterns = (r"aqua initial_activation_policy=[A-Za-z0-9_(). ]+", r"tracking (begin|end) generation=\d+", r"presentation phase=[a-z0-9-]+ generation=\d+ window=\d+ tracking=[01] ax=[01] pixels=[01] stage=[a-z-]+", r"PASS item45 aqua action-to-stage", r"synthetic target unchanged and removed")
          if app.is_file():
              for line in app.read_text(errors="replace").splitlines():
                  if any(re.fullmatch(pattern, line) for pattern in patterns):
                      print(line)
          failure = folder / "aqua.err"
          if failure.is_file():
              # Fixed diagnostic categories only. Do not print raw paths or native logs.
              text = failure.read_text(errors="replace")
              for category in ("before NSApplication", "Accessory policy", "NSMenuDidBeginTracking", "NSMenuDidEndTracking", "tracking exercise", "before presentation sample", "AX or own-window pixels"):
                  if category in text:
                      print("fixture failure", category)
          ' "$RUNNER_TEMP/item45-evidence"
      - name: Preserve fixture menu frames only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: item45-owned-menu-frames
          path: ${{ runner.temp }}/item45-evidence/frames/*.png
          if-no-files-found: ignore
          retention-days: 3
