[workspace]
members = ["crates/voiceport-core", "crates/voiceport-cli", "crates/voiceport-windows", "crates/voiceport-macos", "crates/voiceport-control"]
resolver = "2"

[workspace.package]
version = "0.3.14"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
base64 = "0.22.1"
dirs = "6.0"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt", "net", "io-util", "signal", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tempfile = "3.23"
