[package]
name = "voiceport-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "voiceport-macos"
path = "src/main.rs"

[[test]]
name = "stop_failure"
path = "tests/stop_failure.rs"
harness = false

[[test]]
name = "clipboard_layout"
path = "tests/clipboard_layout.rs"
harness = false

[[test]]
name = "shortcut_native"
path = "tests/shortcut_native.rs"
harness = false

[dependencies]
voiceport-control = { path = "../voiceport-control" }
voiceport-core = { path = "../voiceport-core" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
base64.workspace = true
tempfile.workspace = true
ring = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-av-foundation = "0.3.2"
objc2-avf-audio = "0.3.2"
objc2-speech = "0.3.2"
block2 = "0.6.2"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
libc = "0.2"
unicode-segmentation = "1.12"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile.workspace = true
