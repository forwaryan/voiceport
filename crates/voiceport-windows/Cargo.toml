[package]
name = "voiceport-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["service"]
service = ["dep:voiceport-core", "dep:tokio"]

[dependencies]
voiceport-core = { path = "../voiceport-core", optional = true }
tokio-util.workspace = true
tokio = {workspace = true, optional = true}

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_Com"] }

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
